name: Deploy API

on:
  workflow_dispatch:
  # After each successful weekly refresh, so the app always runs current main.
  workflow_run:
    workflows: ["Weekly NFL Data Refresh"]
    types: [completed]
  # And when a merge changes the app itself. The refresh's own commit (the
  # row-counts file) is outside these paths.
  push:
    branches: [main]
    paths:
      - "api/**"
      - "pipeline/**"
      - "Dockerfile"
      - "fly.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"

# One deploy at a time; a newer one waits rather than cancelling a deploy mid-way.
concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  FLY_APP: nfl-data-api

jobs:
  deploy:
    # workflow_run fires on every completion; skip failed or cancelled refreshes.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flyctl
        run: curl -L https://fly.io/install.sh | sh

      - name: Deploy to Fly.io
        run: |
          export PATH="$HOME/.fly/bin:$PATH"
          fly deploy --app "$FLY_APP" --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
